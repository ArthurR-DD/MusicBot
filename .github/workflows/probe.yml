name: Probe host (temporary)

# Read-only diagnostics for the bot host. Runs only for pushes to this branch.
on:
  push:
    branches: [claude/sharp-wright-4mcsvk]
    paths: [.github/workflows/probe.yml]

jobs:
  probe:
    runs-on: [self-hosted, bot-host]
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          set +e
          echo "== suggest endpoint from host"
          for q in "daft pu" "homer"; do
            ( time curl -sS -m 10 -G "https://suggestqueries.google.com/complete/search" \
              --data-urlencode "client=firefox" --data-urlencode "ds=yt" --data-urlencode "q=$q" \
              -w "\nHTTP %{http_code} type=%{content_type}\n" | head -c 500 ) 2>&1 | grep -vE "^(user|sys)|^$"
          done
