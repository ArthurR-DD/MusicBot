name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on GitHub's own runners, so nothing touches the self-hosted machine.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The native Opus build and the yt-dlp download aren't needed to
      # typecheck or run the tests, and skipping them keeps CI quick.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: 1

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

  # Redeploys the bot on the self-hosted machine. `needs: check` is the point of
  # running deploys through Actions at all — a red commit never reaches the bot.
  #
  # Inert until you opt in: set the repository variable SELF_HOSTED_DEPLOY to
  # "true" (Settings -> Secrets and variables -> Actions -> Variables) once a
  # runner is registered. Without that guard, every push to main would queue a
  # job forever on a runner that doesn't exist yet.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && vars.SELF_HOSTED_DEPLOY == 'true'
    runs-on: [self-hosted, bot-host]
    # Don't hang indefinitely if the runner is offline.
    timeout-minutes: 60
    # Never interrupt a deploy part-way through a build.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # No actions/checkout: we deploy the existing clone, which holds the .env
      # and the music library that a fresh workspace checkout wouldn't have.
      # Set the DEPLOY_DIR repository variable to an absolute path if the clone
      # isn't at $HOME/ShopList.
      - name: Pull and redeploy
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          # Resolve the clone: an explicit DEPLOY_DIR wins, otherwise take the
          # first candidate that exists. ShopList is still accepted because the
          # repository was renamed after the host was set up, so the deploy
          # keeps working whether or not the directory has been renamed yet.
          dir="${DEPLOY_DIR:-}"
          if [ -z "$dir" ]; then
            for candidate in "$HOME/MusicBot" "$HOME/ShopList"; do
              if [ -d "$candidate" ]; then dir="$candidate"; break; fi
            done
          fi
          if [ -z "$dir" ] || [ ! -d "$dir" ]; then
            echo "No deploy directory found. Set the DEPLOY_DIR repository variable." >&2
            exit 1
          fi
          echo "Deploying $dir"
          cd "$dir"
          git fetch origin main
          # --ff-only rather than a merge, so a dirty or diverged checkout stops
          # the deploy instead of being silently rewritten.
          git merge --ff-only origin/main
          docker compose up -d --build
          docker image prune -f
          docker compose ps
