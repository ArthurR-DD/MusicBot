# docker-compose.yml — run the Discord music bot on a VPS / EC2 instance.
#
# Put DISCORD_TOKEN, CLIENT_ID and GUILD_ID in a .env file next to this one
# (copy .env.example). Drop your audio files into ./music.
#
#   docker compose up -d --build     # start (and rebuild on updates)
#   docker compose logs -f           # follow logs
#   docker compose down              # stop

services:
  bot:
    build: .
    image: shoplist-bot
    container_name: shoplist-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      # Local audio library. Writable so /upload can add files — the folder must
      # be owned by uid 1001 on the host (see "Uploads" in the README).
      # Point the left side at wherever your files live if it isn't ./music.
      - ./music:/app/music
