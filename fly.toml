# fly.toml — Discord music bot
#
# This is an outbound-only bot: it connects out to Discord's gateway (TCP) and
# voice servers (UDP). It exposes NO inbound HTTP, so there is intentionally no
# [http_service] / [[services]] block — do not let `fly launch` add one back.
# A health-checked HTTP service (e.g. on port 8080) would fail and cause the
# machine to be marked unhealthy, stopped, or restarted in a loop.

app = 'shoplist-swkbew'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'

# No autostop / no health-checked service: the bot must stay running to hold its
# gateway and voice connections.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
